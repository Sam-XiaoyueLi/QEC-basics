[project]
name = "qec-basics"
version = "0.1.0"
description = "Tutorials on quantum error correction, surface codes, and decoding"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "el-loom>=0.4.0",
    "matplotlib>=3.11.1",
    "numpy>=2.2",
    "pymatching>=2.4.0",
    "stim>=1.16.0",
    "sinter>=1.16.0",
    "tqec>=0.2.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
]
