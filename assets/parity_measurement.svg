<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" role="img" aria-labelledby="title desc">
  <title id="title">Ancilla-based two-qubit parity measurement circuit</title>
  <desc id="desc">Data qubits q0 and q1 control CNOT gates targeting ancilla a. The ancilla is then measured, producing the parity bit.</desc>
  <rect width="980" height="300" fill="#ffffff"/>
  <style>
    .wire { stroke:#202124; stroke-width:2.5; }
    .gate { fill:#eef4ff; stroke:#1a73e8; stroke-width:2.5; }
    .label { font: 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill:#202124; }
    .small { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill:#5f6368; }
    .mono { font: 18px ui-monospace, SFMono-Regular, Menlo, monospace; fill:#202124; }
  </style>

  <text x="36" y="45" class="label" font-weight="600">Two-qubit parity measurement: Z₀Z₁</text>
  <text x="36" y="72" class="small">q₀ and q₁ are data qubits; a is an ancilla initialized in |0⟩.</text>

  <text x="36" y="126" class="mono">q₀</text>
  <text x="36" y="186" class="mono">q₁</text>
  <text x="36" y="246" class="mono">a</text>
  <text x="75" y="126" class="small">|d₀⟩</text>
  <text x="75" y="186" class="small">|d₁⟩</text>
  <text x="75" y="246" class="small">|0⟩</text>

  <line x1="145" y1="120" x2="875" y2="120" class="wire"/>
  <line x1="145" y1="180" x2="875" y2="180" class="wire"/>
  <line x1="145" y1="240" x2="875" y2="240" class="wire"/>

  <line x1="355" y1="120" x2="355" y2="240" class="wire"/>
  <circle cx="355" cy="120" r="8" fill="#202124"/>
  <circle cx="355" cy="240" r="18" fill="#ffffff" stroke="#202124" stroke-width="2.5"/>
  <line x1="337" y1="240" x2="373" y2="240" class="wire"/>
  <line x1="355" y1="222" x2="355" y2="258" class="wire"/>
  <text x="294" y="102" class="small">CX(q₀, a)</text>

  <line x1="595" y1="180" x2="595" y2="240" class="wire"/>
  <circle cx="595" cy="180" r="8" fill="#202124"/>
  <circle cx="595" cy="240" r="18" fill="#ffffff" stroke="#202124" stroke-width="2.5"/>
  <line x1="577" y1="240" x2="613" y2="240" class="wire"/>
  <line x1="595" y1="222" x2="595" y2="258" class="wire"/>
  <text x="534" y="162" class="small">CX(q₁, a)</text>

  <rect x="760" y="216" width="58" height="48" rx="4" class="gate"/>
  <text x="780" y="248" class="label" text-anchor="middle">M</text>
  <line x1="818" y1="240" x2="890" y2="240" class="wire"/>
  <path d="M 835 230 A 15 15 0 0 1 865 230" fill="none" stroke="#202124" stroke-width="2"/>
  <line x1="850" y1="230" x2="874" y2="210" class="wire"/>
  <text x="842" y="278" class="small" text-anchor="middle">parity bit</text>

  <text x="145" y="294" class="small">Measurement result: 0 for even parity (00, 11); 1 for odd parity (01, 10).</text>
</svg>